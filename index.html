<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLibrary</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 30px;
        background: #0d1117;
        color: #c9d1d9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .container { max-width: 1100px; margin: auto; }
    h1 { margin-bottom: 8px; color: #f0f6fc; }
    .subtitle { color: #8b949e; margin-bottom: 25px; }
    .tree { font-family: Consolas, "Courier New", monospace; font-size: 15px; }
    details { margin: 3px 0; }
    summary {
        cursor: pointer;
        padding: 5px 8px;
        border-radius: 6px;
        list-style: none;
        user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before {
        content: "▶";
        display: inline-block;
        width: 20px;
        font-size: 11px;
        transition: transform 0.15s;
    }
    details[open] > summary::before { transform: rotate(90deg); }
    summary:hover, .file:hover { background: #161b22; }
    .folder { color: #58a6ff; font-weight: 600; }
    .files {
        margin-left: 20px;
        border-left: 1px solid #30363d;
        padding-left: 15px;
    }
    .file {
        display: block;
        padding: 5px 8px;
        border-radius: 6px;
        color: #c9d1d9;
        text-decoration: none;
    }
    .file:hover { color: #58a6ff; }
    .icon { display: inline-block; width: 2em; text-align: center; }
    .info {
        margin-top: 30px;
        padding: 12px 15px;
        border: 1px solid #30363d;
        border-radius: 8px;
        color: #8b949e;
        font-size: 14px;
    }
    .error { color: #f85149; }
</style>
</head>
<body>
<div class="container">
    <h1>MyLibrary</h1>
    <div class="subtitle">Personal research library</div>
    <div id="tree" class="tree" aria-live="polite">Loading files…</div>
    <div id="info" class="info">File icons are loaded from <code>.icons.csv</code>.</div>
</div>
<script>
(async () => {
    const owner = "RummEst";
    const repo = "MyLibrary";
    const branch = "main";
    const tree = document.getElementById("tree");
    const info = document.getElementById("info");

    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    }[character]));

    const encodePath = path => path.split("/").map(encodeURIComponent).join("/");

    function parseCsv(text) {
        const icons = new Map();
        text.trim().split(/\r?\n/).slice(1).forEach(line => {
            const comma = line.indexOf(",");
            if (comma === -1) return;
            const filename = line.slice(0, comma).trim();
            const icon = line.slice(comma + 1).trim();
            if (filename && icon) icons.set(filename, icon);
        });
        return icons;
    }

    function makeFolder(name, children) {
        const element = document.createElement("details");
        const summary = document.createElement("summary");
        summary.className = "folder";
        summary.textContent = name;
        element.append(summary, children);
        return element;
    }

    function makeFile(path, icons) {
        const name = path.split("/").pop();
        const link = document.createElement("a");
        link.className = "file";
        link.href = encodePath(path);
        link.innerHTML = `<span class="icon">${escapeHtml(icons.get(name) || "")}</span>${escapeHtml(name)}`;
        link.title = path;
        return link;
    }

    function renderTree(paths, icons) {
        const root = { folders: new Map(), files: [] };
        paths.forEach(path => {
            const parts = path.split("/");
            let node = root;
            parts.forEach((part, index) => {
                if (index === parts.length - 1) node.files.push({ name: part, path });
                else {
                    if (!node.folders.has(part)) node.folders.set(part, { folders: new Map(), files: [] });
                    node = node.folders.get(part);
                }
            });
        });

        function build(node) {
            const contents = document.createElement("div");
            contents.className = "files";
            [...node.folders.entries()].sort(([a], [b]) => a.localeCompare(b)).forEach(([name, child]) => {
                contents.appendChild(makeFolder(name, build(child)));
            });
            node.files.sort((a, b) => a.name.localeCompare(b.name)).forEach(file => {
                contents.appendChild(makeFile(file.path, icons));
            });
            return contents;
        }

        tree.replaceChildren(build(root));
        info.textContent = `${paths.length} current repository files listed. File icons are loaded from .icons.csv.`;
    }

    try {
        const apiBase = `https://api.github.com/repos/${owner}/${repo}`;
        const [treeResponse, iconsResponse] = await Promise.all([
            fetch(`${apiBase}/git/trees/${branch}?recursive=1`),
            fetch(`.icons.csv?${Date.now()}`)
        ]);
        if (!treeResponse.ok) throw new Error("Could not load the repository file list.");
        const repositoryTree = await treeResponse.json();
        const icons = iconsResponse.ok ? parseCsv(await iconsResponse.text()) : new Map();
        const paths = (repositoryTree.tree || [])
            .filter(entry => entry.type === "blob" && entry.path !== "index.html")
            .map(entry => entry.path);
        renderTree(paths, icons);
    } catch (error) {
        tree.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        info.textContent = "The file list could not be loaded. Please try again later.";
    }
})();
</script>
</body>
</html>
