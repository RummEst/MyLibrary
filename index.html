<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MyLibrary</title>
<style>
:root{--bg:#0a0c0f;--bg-header:#0d1017;--border:#1e2430;--text:#c8cdd8;--dim:#4a5468;--tree-line:#232a38;--prompt:#3d8bff;--folder:#3d8bff;--html:#e06c4e;--csv:#4ec994;--json:#e0b24e;--md:#a78bfa;--txt:#8b949e;--hover-bg:#131720;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.5 Menlo,Consolas,"Liberation Mono",monospace;-webkit-font-smoothing:antialiased}body{padding:var(--safe-top) 0 var(--safe-bot);overflow-x:hidden}.terminal{max-width:700px;margin:auto;padding-bottom:40px}.header{background:var(--bg-header);border-bottom:1px solid var(--border);padding:18px 20px 14px;position:sticky;top:var(--safe-top);z-index:10}.header-row{display:flex;align-items:baseline;gap:10px}.prompt-sym{color:var(--prompt);font-size:15px;font-weight:700}.header h1{font-size:15px;color:#eef1f7}.header-meta{margin-top:6px;padding-left:20px;color:var(--dim);font-size:11.5px}.header-meta span,.status span{color:var(--prompt)}.search-wrap{padding:10px 20px 12px;background:var(--bg-header);border-bottom:1px solid var(--border)}.search-inner{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 10px}.search-inner svg{opacity:.4}#search{background:none;border:0;outline:0;color:var(--text);font:12.5px inherit;width:100%}#search::placeholder{color:var(--dim)}.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 20px 0}.legend-item{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:11px}.legend-dot{width:7px;height:7px;border-radius:50%}.ld-dir{background:var(--folder)}.ld-html{background:var(--html)}.ld-csv{background:var(--csv)}.ld-json{background:var(--json)}.ld-md{background:var(--md)}.ld-txt{background:var(--txt)}.tree{padding-top:14px;user-select:none}.repo-root{padding:2px 20px 6px;display:flex;gap:6px;color:var(--dim);font-size:11.5px}.repo-root-name{color:var(--folder);font-weight:700;font-size:13px}.row{display:flex;align-items:center;width:100%;min-height:30px;padding:0 20px;cursor:pointer;text-decoration:none;color:inherit;transition:background .08s}.row:hover{background:var(--hover-bg)}.prefix{color:var(--tree-line);white-space:pre;flex-shrink:0;font-size:13px;line-height:1}.toggle{flex-shrink:0;width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:9px;margin-right:4px;transition:transform .12s}.toggle.open{transform:rotate(90deg)}.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder-name{color:var(--folder);font-weight:600}.icon{flex-shrink:0;width:20px;text-align:center;margin-right:5px;font-size:14px;line-height:1}.ext{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:8px;flex-shrink:0;font-weight:600;letter-spacing:.04em;opacity:.75}.ext-html{color:var(--html);background:#e06c4e1f}.ext-csv{color:var(--csv);background:#4ec9941f}.ext-json{color:var(--json);background:#e0b24e1f}.ext-md{color:var(--md);background:#a78bfa1f}.ext-txt,.ext-other{color:var(--txt);background:#8b949e1a}.folder-children{display:none}.folder-children.open{display:block}.hidden{display:none!important}.status{padding:16px 20px 0;color:var(--dim);font-size:11.5px;border-top:1px solid var(--border);margin-top:12px}.cursor{display:inline-block;width:7px;height:13px;background:var(--prompt);margin-left:3px;vertical-align:text-bottom;animation:blink 1.1s step-end infinite}@keyframes blink{50%{opacity:0}}.loading{padding:30px 20px;color:var(--dim);display:flex;gap:10px}.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--prompt);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error-msg{color:#f85149;padding:20px}
</style>
</head>
<body><div class="terminal">
<div class="header"><div class="header-row"><span class="prompt-sym">$</span><h1>MyLibrary</h1></div><div class="header-meta">tree <span>RummEst/MyLibrary</span> &mdash; personal research library</div></div>
<div class="search-wrap"><div class="search-inner"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="search" type="text" placeholder="filter files…" autocomplete="off" spellcheck="false"></div></div>
<div class="legend"><div class="legend-item"><div class="legend-dot ld-dir"></div>folder</div><div class="legend-item"><div class="legend-dot ld-html"></div>.html</div><div class="legend-item"><div class="legend-dot ld-csv"></div>.csv</div><div class="legend-item"><div class="legend-dot ld-json"></div>.json</div><div class="legend-item"><div class="legend-dot ld-md"></div>.md</div><div class="legend-item"><div class="legend-dot ld-txt"></div>other</div></div>
<div class="tree" id="tree"><div class="loading"><div class="spinner"></div>fetching repository tree…</div></div>
<div class="status" id="status" style="display:none"><span id="status-count"></span> files &mdash; icons from .icons.csv<span class="cursor"></span></div>
</div>
<script>
(async()=>{
  const OWNER="RummEst",REPO="MyLibrary",BRANCH="main",ICON_URL="https://raw.githubusercontent.com/RummEst/MyLibrary/refs/heads/main/.icons.csv";
  const treeEl=document.getElementById("tree"),statusEl=document.getElementById("status"),countEl=document.getElementById("status-count"),searchEl=document.getElementById("search");
  const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const encodePath=p=>p.split("/").map(encodeURIComponent).join("/");
  function parseCsv(text){const map=new Map();text.trim().split(/\r?\n/).slice(1).forEach(line=>{const i=line.indexOf(",");if(i<0)return;const fn=line.slice(0,i).trim(),ic=line.slice(i+1).trim();if(fn&&ic)map.set(fn,ic)});return map}
  function extClass(name){const ext=((name.match(/\.([^.]+)$/)||[])[1]||"").toLowerCase();return ext==="html"?["html","ext-html"]:ext==="csv"?["csv","ext-csv"]:ext==="json"?["json","ext-json"]:ext==="md"?["md","ext-md"]:ext==="txt"?["txt","ext-txt"]:[ext||"—","ext-other"]}
  function buildTree(paths,icons){
    const root={folders:new Map,files:[]};paths.forEach(path=>{const parts=path.split("/");let node=root;parts.forEach((part,i)=>{if(i===parts.length-1)node.files.push({name:part,path});else{if(!node.folders.has(part))node.folders.set(part,{folders:new Map,files:[]});node=node.folders.get(part)}})});
    const fragment=document.createDocumentFragment(),rootLabel=document.createElement("div");rootLabel.className="repo-root";rootLabel.innerHTML=`<span>./</span><span class="repo-root-name">${REPO}</span>`;fragment.appendChild(rootLabel);
    function render(node,prefix,container){const folders=[...node.folders.entries()].sort(([a],[b])=>a.localeCompare(b)),files=[...node.files].sort((a,b)=>a.name.localeCompare(b.name)),entries=[...folders.map(([name,child])=>({type:"folder",name,child})),...files.map(f=>({type:"file",...f}))];entries.forEach((entry,i)=>{const last=i===entries.length-1,branch=last?"└── ":"├── ",childPfx=prefix+(last?"    ":"│   ");if(entry.type==="folder"){const row=document.createElement("div");row.className="row folder-row";row.setAttribute("role","button");row.setAttribute("tabindex","0");row.dataset.name=entry.name.toLowerCase();row.innerHTML=`<span class="prefix">${esc(prefix+branch)}</span><span class="toggle open">&#9658;</span><span class="name folder-name">${esc(entry.name)}/</span>`;container.appendChild(row);const children=document.createElement("div");children.className="folder-children open";container.appendChild(children);render(entry.child,childPfx,children);const toggle=row.querySelector(".toggle"),doToggle=()=>{const open=children.classList.toggle("open");toggle.classList.toggle("open",open)};row.addEventListener("click",doToggle);row.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();doToggle()}})}else{const a=document.createElement("a");a.className="row file-row";a.href=encodePath(entry.path);a.dataset.name=entry.name.toLowerCase();a.dataset.path=entry.path.toLowerCase();if(/\.html$/i.test(entry.name))a.target="_blank";const [label,cls]=extClass(entry.name),emoji=icons.get(entry.name)||"";a.innerHTML=`<span class="prefix">${esc(prefix+branch)}</span>${emoji?`<span class="icon">${esc(emoji)}</span>`:'<span class="icon" style="color:var(--dim);font-size:11px">·</span>'}<span class="name">${esc(entry.name)}</span><span class="ext ${cls}">${esc(label)}</span>`;container.appendChild(a)}})}
    render(root,"",fragment);treeEl.replaceChildren(fragment);countEl.textContent=paths.length;statusEl.style.display="";
  }
  function applyFilter(query){query=query.trim().toLowerCase();const rows=treeEl.querySelectorAll(".row");if(!query){rows.forEach(r=>r.classList.remove("hidden"));treeEl.querySelectorAll(".folder-children,.toggle").forEach(e=>e.classList.add("open"));return}treeEl.querySelectorAll(".file-row").forEach(r=>{const hit=r.dataset.path.includes(query);r.classList.toggle("hidden",!hit);if(hit){let el=r.parentElement;while(el&&el!==treeEl){if(el.classList.contains("folder-children")){el.classList.add("open");const parent=el.previousElementSibling;if(parent){parent.classList.remove("hidden");parent.querySelector(".toggle")?.classList.add("open")}}el=el.parentElement}}});treeEl.querySelectorAll(".folder-row").forEach(r=>{const children=r.nextElementSibling;if(children&&!children.querySelector(".file-row:not(.hidden),.folder-row:not(.hidden)"))r.classList.add("hidden")})}
  searchEl.addEventListener("input",()=>applyFilter(searchEl.value));
  try{const apiBase=`https://api.github.com/repos/${OWNER}/${REPO}`;const [treeRes,iconsRes]=await Promise.all([fetch(`${apiBase}/git/trees/${BRANCH}?recursive=1`),fetch(`${ICON_URL}?_=${Date.now()}`,{cache:"no-store"})]);if(!treeRes.ok)throw Error(`GitHub API error ${treeRes.status}`);const repoTree=await treeRes.json(),icons=iconsRes.ok?parseCsv(await iconsRes.text()):new Map(),paths=(repoTree.tree||[]).filter(e=>e.type==="blob"&&e.path!=="index.html").map(e=>e.path);buildTree(paths,icons)}catch(err){treeEl.innerHTML=`<p class="error-msg">Error: ${esc(err.message)}</p>`}
})();
</script></body></html>
