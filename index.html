<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MyLibrary</title>
<style>
  :root {
    --bg:         #0a0c0f;
    --bg-header:  #0d1017;
    --border:     #1e2430;
    --text:       #c8cdd8;
    --dim:        #4a5468;
    --tree-line:  #232a38;
    --prompt:     #3d8bff;
    --folder:     #3d8bff;
    --html:       #e06c4e;
    --csv:        #4ec994;
    --json:       #e0b24e;
    --md:         #a78bfa;
    --txt:        #8b949e;
    --other:      #8b949e;
    --hover-bg:   #131720;
    --cursor:     #3d8bff;
    --safe-top:   env(safe-area-inset-top, 0px);
    --safe-bot:   env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Menlo', 'Consolas', 'Liberation Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bot);
    overflow-x: hidden;
  }

  .terminal {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 0 40px;
  }

  /* ── Header ── */
  .header {
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    position: sticky;
    top: var(--safe-top);
    z-index: 10;
  }

  .header-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .prompt-sym {
    color: var(--prompt);
    font-size: 15px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 15px;
    font-weight: 700;
    color: #eef1f7;
    letter-spacing: 0.01em;
  }

  .header-meta {
    margin-top: 6px;
    padding-left: 20px;
    color: var(--dim);
    font-size: 11.5px;
  }

  .header-meta span { color: var(--prompt); }

  /* ── Search ── */
  .search-wrap {
    padding: 10px 20px 0;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  .search-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
  }

  .search-inner svg {
    flex-shrink: 0;
    opacity: 0.4;
  }

  #search {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    width: 100%;
  }

  #search::placeholder { color: var(--dim); }

  /* ── Tree ── */
  .tree {
    padding: 14px 0 0;
    user-select: none;
  }

  /* root-level repo label */
  .repo-root {
    padding: 2px 20px 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--dim);
    font-size: 11.5px;
  }

  .repo-root-name {
    color: var(--folder);
    font-weight: 700;
    font-size: 13px;
  }

  /* Each row */
  .row {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 30px;
    padding: 0 20px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: background 0.08s;
    gap: 0;
  }

  .row:hover { background: var(--hover-bg); }

  /* ASCII prefix (├── / └── / │   ) */
  .prefix {
    color: var(--tree-line);
    white-space: pre;
    flex-shrink: 0;
    font-size: 13px;
    line-height: 1;
  }

  /* folder toggle icon */
  .toggle {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-size: 9px;
    margin-right: 4px;
    transition: transform 0.12s;
  }

  .toggle.open { transform: rotate(90deg); }

  /* file/folder name */
  .name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .folder-name { color: var(--folder); font-weight: 600; }

  /* extension badge */
  .ext {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 8px;
    flex-shrink: 0;
    font-weight: 600;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .ext-html { color: var(--html); background: rgba(224,108,78,0.12); }
  .ext-csv  { color: var(--csv);  background: rgba(78,201,148,0.12); }
  .ext-json { color: var(--json); background: rgba(224,178,78,0.12); }
  .ext-md   { color: var(--md);   background: rgba(167,139,250,0.12); }
  .ext-txt  { color: var(--txt);  background: rgba(139,148,158,0.10); }
  .ext-other{ color: var(--other);background: rgba(139,148,158,0.10); }

  /* file icon / emoji */
  .icon {
    flex-shrink: 0;
    width: 20px;
    text-align: center;
    margin-right: 5px;
    font-size: 14px;
    line-height: 1;
  }

  /* Folder children container */
  .folder-children { display: none; }
  .folder-children.open { display: block; }

  /* Hidden by search */
  .hidden { display: none !important; }

  /* Status / footer */
  .status {
    padding: 16px 20px 0;
    color: var(--dim);
    font-size: 11.5px;
    border-top: 1px solid var(--border);
    margin-top: 12px;
  }

  .status span { color: var(--prompt); }

  /* Cursor blink */
  .cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: var(--cursor);
    margin-left: 3px;
    vertical-align: text-bottom;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    padding: 10px 20px 0;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--dim);
  }

  .legend-dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .ld-html { background: var(--html); }
  .ld-csv  { background: var(--csv);  }
  .ld-json { background: var(--json); }
  .ld-md   { background: var(--md);   }
  .ld-txt  { background: var(--other);}
  .ld-dir  { background: var(--folder);}

  /* Loading spinner */
  .loading {
    padding: 30px 20px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--prompt);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg { color: #f85149; padding: 20px; }
</style>
</head>
<body>
<div class="terminal">

  <!-- Header -->
  <div class="header">
    <div class="header-row">
      <span class="prompt-sym">$</span>
      <h1>MyLibrary</h1>
    </div>
    <div class="header-meta">
      tree <span>RummEst/MyLibrary</span> &mdash; personal research library
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-inner">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search" type="text" placeholder="filter files…" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot ld-dir"></div>folder</div>
    <div class="legend-item"><div class="legend-dot ld-html"></div>.html</div>
    <div class="legend-item"><div class="legend-dot ld-csv"></div>.csv</div>
    <div class="legend-item"><div class="legend-dot ld-json"></div>.json</div>
    <div class="legend-item"><div class="legend-dot ld-md"></div>.md</div>
    <div class="legend-item"><div class="legend-dot ld-txt"></div>other</div>
  </div>

  <!-- Tree -->
  <div class="tree" id="tree">
    <div class="loading"><div class="spinner"></div>fetching repository tree…</div>
  </div>

  <div class="status" id="status" style="display:none">
    <span id="status-count"></span> files &mdash; icons from .icons.csv<span class="cursor"></span>
  </div>
</div>

<script>
(async () => {
  const OWNER  = "RummEst";
  const REPO   = "MyLibrary";
  const BRANCH = "main";
  const treeEl  = document.getElementById("tree");
  const statusEl = document.getElementById("status");
  const countEl  = document.getElementById("status-count");
  const searchEl = document.getElementById("search");

  /* ── helpers ── */
  const esc = v => String(v).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const encodePath = p => p.split("/").map(encodeURIComponent).join("/");

  function parseCsv(text) {
    const map = new Map();
    text.trim().split(/\r?\n/).slice(1).forEach(line => {
      const i = line.indexOf(",");
      if (i === -1) return;
      const fn = line.slice(0, i).trim();
      const ic = line.slice(i + 1).trim();
      if (fn && ic) map.set(fn, ic);
    });
    return map;
  }

  function extClass(name) {
    const m = name.match(/\.([^.]+)$/);
    const ext = m ? m[1].toLowerCase() : "";
    if (ext === "html") return ["html", "ext-html"];
    if (ext === "csv")  return ["csv",  "ext-csv"];
    if (ext === "json") return ["json", "ext-json"];
    if (ext === "md")   return ["md",   "ext-md"];
    if (ext === "txt")  return ["txt",  "ext-txt"];
    return [ext || "—", "ext-other"];
  }

  /* ── build DOM tree ── */
  function buildTree(paths, icons) {
    /* nest into object */
    const root = { folders: new Map(), files: [] };
    paths.forEach(path => {
      const parts = path.split("/");
      let node = root;
      parts.forEach((part, idx) => {
        if (idx === parts.length - 1) {
          node.files.push({ name: part, path });
        } else {
          if (!node.folders.has(part))
            node.folders.set(part, { folders: new Map(), files: [] });
          node = node.folders.get(part);
        }
      });
    });

    const fragment = document.createDocumentFragment();

    /* repo root row */
    const rootLabel = document.createElement("div");
    rootLabel.className = "repo-root";
    rootLabel.innerHTML = `<span style="color:var(--dim)">./</span><span class="repo-root-name">${REPO}</span>`;
    fragment.appendChild(rootLabel);

    /* render node recursively */
    function render(node, prefix, container) {
      const folders = [...node.folders.entries()].sort(([a],[b]) => a.localeCompare(b));
      const files   = [...node.files].sort((a,b) => a.name.localeCompare(b.name));
      const entries = [
        ...folders.map(([name, child]) => ({ type:"folder", name, child })),
        ...files.map(f => ({ type:"file", ...f }))
      ];

      entries.forEach((entry, i) => {
        const isLast = i === entries.length - 1;
        const branch = isLast ? "└── " : "├── ";
        const childPfx = prefix + (isLast ? "    " : "│   ");

        if (entry.type === "folder") {
          /* folder row */
          const row = document.createElement("div");
          row.className = "row folder-row";
          row.setAttribute("role","button");
          row.setAttribute("tabindex","0");
          row.dataset.name = entry.name.toLowerCase();

          const toggle = document.createElement("span");
          toggle.className = "toggle open";
          toggle.innerHTML = "&#9658;"; /* ► */

          row.innerHTML = `<span class="prefix">${esc(prefix + branch)}</span>`;
          row.appendChild(toggle);
          row.innerHTML += `<span class="name folder-name">${esc(entry.name)}/</span>`;
          container.appendChild(row);

          /* children */
          const children = document.createElement("div");
          children.className = "folder-children open";
          container.appendChild(children);

          render(entry.child, childPfx, children);

          const toggle2 = row.querySelector(".toggle");
          function doToggle() {
            const isOpen = children.classList.toggle("open");
            toggle2.classList.toggle("open", isOpen);
          }
          row.addEventListener("click", doToggle);
          row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doToggle(); } });

        } else {
          /* file row */
          const a = document.createElement("a");
          a.className = "row file-row";
          a.href = encodePath(entry.path);
          a.dataset.name = entry.name.toLowerCase();
          a.dataset.path = entry.path.toLowerCase();
          /* open html in new tab, others download */
          const ext = (entry.name.match(/\.([^.]+)$/) || [])[1] || "";
          if (ext === "html") a.target = "_blank";

          const [extLabel, extCls] = extClass(entry.name);
          const emoji = icons.get(entry.name) || "";
          const iconSpan = emoji
            ? `<span class="icon">${esc(emoji)}</span>`
            : `<span class="icon" style="color:var(--dim);font-size:11px">·</span>`;

          a.innerHTML =
            `<span class="prefix">${esc(prefix + branch)}</span>` +
            iconSpan +
            `<span class="name">${esc(entry.name)}</span>` +
            `<span class="ext ${extCls}">${esc(extLabel)}</span>`;

          container.appendChild(a);
        }
      });
    }

    render(root, "", fragment);
    treeEl.replaceChildren(fragment);

    /* status */
    countEl.textContent = paths.length;
    statusEl.style.display = "";
  }

  /* ── search / filter ── */
  function applyFilter(query) {
    query = query.trim().toLowerCase();
    const allRows = treeEl.querySelectorAll(".row");
    if (!query) {
      allRows.forEach(r => r.classList.remove("hidden"));
      /* restore open folders */
      treeEl.querySelectorAll(".folder-children").forEach(c => c.classList.add("open"));
      treeEl.querySelectorAll(".toggle").forEach(t => t.classList.add("open"));
      return;
    }
    /* show only matching files; keep parent folders visible */
    const fileRows = treeEl.querySelectorAll(".file-row");
    const matchedPaths = new Set();
    fileRows.forEach(r => {
      const hit = r.dataset.path && r.dataset.path.includes(query);
      r.classList.toggle("hidden", !hit);
      if (hit) {
        /* collect all ancestor prefixes */
        let el = r.parentElement;
        while (el && el !== treeEl) {
          if (el.classList.contains("folder-children")) {
            el.classList.add("open");
            /* folder row before this children div */
            const frow = el.previousElementSibling;
            if (frow) {
              frow.classList.remove("hidden");
              const tog = frow.querySelector(".toggle");
              if (tog) tog.classList.add("open");
            }
          }
          el = el.parentElement;
        }
      }
    });
    /* hide folder rows that have no visible children */
    treeEl.querySelectorAll(".folder-row").forEach(r => {
      /* find the children div after it */
      const children = r.nextElementSibling;
      if (!children) return;
      const hasVisible = children.querySelector(".file-row:not(.hidden), .folder-row:not(.hidden)");
      if (!hasVisible) r.classList.add("hidden");
    });
  }

  searchEl.addEventListener("input", () => applyFilter(searchEl.value));

  /* ── fetch ── */
  try {
    const apiBase = `https://api.github.com/repos/${OWNER}/${REPO}`;
    const [treeRes, iconsRes] = await Promise.all([
      fetch(`${apiBase}/git/trees/${BRANCH}?recursive=1`),
      fetch(`.icons.csv?_=${Date.now()}`)
    ]);
    if (!treeRes.ok) throw new Error(`GitHub API error ${treeRes.status}`);
    const repoTree = await treeRes.json();
    const icons = iconsRes.ok ? parseCsv(await iconsRes.text()) : new Map();
    const paths = (repoTree.tree || [])
      .filter(e => e.type === "blob" && e.path !== "index.html")
      .map(e => e.path);
    buildTree(paths, icons);
  } catch (err) {
    treeEl.innerHTML = `<p class="error-msg">Error: ${esc(err.message)}</p>`;
  }
})();
</script>
</body>
</html>
