<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cut Table v2 — split an image into pieces</title>
<style>
  :root{
    --bg:#EFE6D3;
    --bg-grain:#E7DCC4;
    --surface:#FFFFFF;
    --surface-2:#F7F0DF;
    --text:#221C16;
    --text-dim:#736A5B;
    --accent:#D6431F;
    --accent-text:#FFF7EC;
    --line-track:#CFC3A5;
    --ruler:#9A8E76;
    --border:#D8CBAA;
    --shadow: 0 1px 0 rgba(34,28,22,0.06);
    --radius: 3px;
    --font: 'Cutive Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --font-sans: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171310;
      --bg-grain:#1C1712;
      --surface:#221C17;
      --surface-2:#2A231C;
      --text:#F2E9D8;
      --text-dim:#A6997F;
      --accent:#FF6A3D;
      --accent-text:#1B1108;
      --line-track:#4A4136;
      --ruler:#6E6350;
      --border:#3A3228;
      --shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171310;
    --bg-grain:#1C1712;
    --surface:#221C17;
    --surface-2:#2A231C;
    --text:#F2E9D8;
    --text-dim:#A6997F;
    --accent:#FF6A3D;
    --accent-text:#1B1108;
    --line-track:#4A4136;
    --ruler:#6E6350;
    --border:#3A3228;
    --shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, var(--bg-grain) 39px 40px),
      var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    min-height:100vh;
    padding: max(18px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .wrap{ max-width:520px; margin:0 auto; }

  header.hd{ margin-bottom:22px; }
  .eyebrow-mark{
    display:flex; align-items:center; gap:8px;
    color:var(--accent); font-family:var(--font); font-size:12px; letter-spacing:.02em;
  }
  .eyebrow-mark svg{ width:14px; height:14px; flex:none; }
  h1{
    font-size:30px; line-height:1.05; margin:6px 0 6px; font-weight:700;
    letter-spacing:-0.01em;
  }
  .sub{ color:var(--text-dim); font-size:14.5px; line-height:1.5; max-width:46ch; }

  section{ margin-bottom:22px; }
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* upload — FIX: label needs an explicit display or padding/border never expand
     to the container width, which is what collapsed the box in v1. */
  .dropzone{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:34px 20px;
    text-align:center;
    border:1.5px dashed var(--ruler);
    border-radius: var(--radius);
    background: var(--surface-2);
    cursor:pointer;
  }
  .dropzone svg{ width:30px; height:30px; color:var(--accent); margin-bottom:10px; }
  .dropzone .t1{ font-weight:600; font-size:15.5px; }
  .dropzone .t2{ color:var(--text-dim); font-size:13px; margin-top:4px; }
  input[type=file]{ display:none; }

  /* section label */
  .lbl{
    font-family:var(--font); font-size:11.5px; letter-spacing:.03em;
    color:var(--text-dim); margin: 0 0 10px 2px; display:flex; align-items:center; gap:8px;
  }
  .lbl .n{ color:var(--accent); }

  /* stage */
  .stage-shell{
    padding:14px; position:relative;
  }
  .stage{
    position:relative;
    width:100%;
    touch-action:none;
    border-radius:2px;
    overflow:hidden;
    background:
      linear-gradient(45deg, var(--surface-2) 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(-45deg, var(--surface-2) 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(45deg, transparent 75%, var(--surface-2) 75%) -8px 0/16px 16px,
      linear-gradient(-45deg, transparent 75%, var(--surface-2) 75%) -8px 0/16px 16px,
      var(--surface);
  }
  .stage canvas{ display:block; width:100%; height:100%; }
  .lines{ position:absolute; inset:0; }

  .cutline{
    position:absolute;
    touch-action:none;
  }
  .cutline .bar{
    position:absolute;
    background: var(--accent);
  }
  .cutline.v{ top:0; bottom:0; width:26px; cursor:ew-resize; transform:translateX(-13px); }
  .cutline.v .bar{ left:12px; top:0; bottom:0; width:2px; box-shadow:0 0 0 1px rgba(0,0,0,.15); }
  .cutline.h{ left:0; right:0; height:26px; cursor:ns-resize; transform:translateY(-13px); }
  .cutline.h .bar{ top:12px; left:0; right:0; height:2px; box-shadow:0 0 0 1px rgba(0,0,0,.15); }

  .cutline .tick{
    position:absolute; font-family:var(--font); font-size:9px; color:var(--accent-text);
    background:var(--accent); padding:1px 4px; border-radius:2px; white-space:nowrap;
  }
  .cutline.v .tick{ top:4px; left:16px; }
  .cutline.h .tick{ left:4px; top:16px; }

  .cutline .del{
    position:absolute; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:var(--accent-text); border:none;
    font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .cutline.v .del{ top:-22px; left:3px; }
  .cutline.h .del{ left:-22px; top:3px; }

  /* controls */
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    font-family:var(--font-sans);
    font-size:14px; font-weight:600;
    padding:11px 16px;
    border-radius: var(--radius);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn svg{ width:15px; height:15px; }
  .btn:active{ transform:translateY(1px); }
  .btn.ghost{ background:transparent; color:var(--text-dim); border-color:transparent; padding-left:8px; padding-right:8px; }
  .btn.accent{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn.block{ width:100%; justify-content:center; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .controls-panel{ padding:16px; }
  .controls-panel .row{ margin-bottom:12px; }
  .controls-panel .row:last-child{ margin-bottom:0; }

  .stepper{
    display:flex; align-items:center; gap:0;
    border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  }
  .stepper button{
    width:34px; height:38px; border:none; background:var(--surface-2); color:var(--text);
    font-size:16px; cursor:pointer;
  }
  .stepper .val{
    width:38px; text-align:center; font-family:var(--font); font-size:15px;
  }
  .stepper-group{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); }

  hr.rule{ border:none; border-top:1px solid var(--border); margin:14px 0; }

  /* sticky cut bar */
  .cutbar{
    position:fixed; left:0; right:0; bottom:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    display:flex; justify-content:center;
    z-index:20;
  }
  .cutbar .inner{ width:100%; max-width:488px; }

  /* results */
  .results-hd{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .piece{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden;
  }
  .piece .thumb{
    width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
    background:var(--surface-2);
  }
  .piece .meta{
    padding:8px 10px 10px; display:flex; align-items:center; justify-content:space-between; gap:6px;
  }
  .piece .tag{ font-family:var(--font); font-size:11px; color:var(--text-dim); line-height:1.5; }
  .piece .tag b{ color:var(--text); font-weight:600; }
  .piece .dl{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text); flex:none;
  }
  .piece .dl svg{ width:14px; height:14px; }

  .empty-hint{ color:var(--text-dim); font-size:13px; padding:2px 2px 0; line-height:1.5; }

  .toast{
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    background:var(--text); color:var(--bg);
    padding:9px 16px; border-radius:20px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:30; white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hd">
    <div class="eyebrow-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg>
      cut table v2
    </div>
    <h1>Slice a collage into single images</h1>
    <div class="sub">Upload an image, drop in cut lines by hand or auto-grid them, then cut. Every piece comes out as its own file, with its resolution and size shown.</div>
  </header>

  <section id="uploadSection">
    <label class="dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M12 4 7 9M12 4l5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <div class="t1">Tap to choose an image</div>
      <div class="t2">JPG, PNG, WebP — works with screenshots &amp; collages</div>
      <input type="file" id="fileInput" accept="image/*">
    </label>
  </section>

  <section id="editorSection" class="hidden">
    <div class="lbl"><span class="n">01</span> place your cut lines</div>
    <div class="empty-hint" id="origInfo" style="margin-bottom:10px;"></div>
    <div class="panel stage-shell">
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="lines" id="lines"></div>
      </div>
    </div>

    <div style="height:12px"></div>

    <div class="panel controls-panel">
      <div class="row">
        <button class="btn" id="addV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3"/></svg>
          Vertical line
        </button>
        <button class="btn" id="addH">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
          Horizontal line
        </button>
        <button class="btn ghost" id="clearLines">Clear lines</button>
      </div>

      <hr class="rule">

      <div class="row" style="align-items:center; justify-content:space-between;">
        <div class="stepper-group">
          rows
          <div class="stepper">
            <button id="rowsMinus" type="button">&minus;</button>
            <div class="val" id="rowsVal">2</div>
            <button id="rowsPlus" type="button">+</button>
          </div>
        </div>
        <div class="stepper-group">
          cols
          <div class="stepper">
            <button id="colsMinus" type="button">&minus;</button>
            <div class="val" id="colsVal">2</div>
            <button id="colsPlus" type="button">+</button>
          </div>
        </div>
        <button class="btn accent" id="applyGrid">Auto grid</button>
      </div>
    </div>

    <div style="height:16px"></div>
    <button class="btn ghost" id="changeImage" style="padding-left:2px;">&larr; choose a different image</button>
  </section>

  <section id="resultsSection" class="hidden">
    <div class="results-hd">
      <div class="lbl" style="margin:0;"><span class="n">02</span> <span id="resultsCount">0 pieces</span></div>
      <button class="btn accent" id="downloadAll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M12 15l-4-4M12 15l4-4"/><path d="M4 19h16"/></svg>
        Download all
      </button>
    </div>
    <div class="grid" id="resultsGrid"></div>
  </section>

</div>

<div class="cutbar" id="cutbar" style="display:none;">
  <div class="inner">
    <button class="btn accent block" id="cutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg>
      Cut into <span id="cutCount">4</span> pieces
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- state ----------
  var img = null, naturalW = 0, naturalH = 0, sourceCanvas = null;
  var originalFile = null;
  var verticalLines = [];   // [{id, pct}]  pct = % from left
  var horizontalLines = []; // [{id, pct}]  pct = % from top
  var pieces = [];          // [{blob, url, w, h, row, col}]
  var dragging = null;      // {id, type}

  // ---------- elements ----------
  var el = {};
  ["dropzone","fileInput","uploadSection","editorSection","resultsSection",
   "stage","canvas","lines","origInfo",
   "addV","addH","clearLines",
   "rowsMinus","rowsPlus","rowsVal","colsMinus","colsPlus","colsVal","applyGrid",
   "changeImage","cutbar","cutBtn","cutCount",
   "resultsGrid","resultsCount","downloadAll","toast"
  ].forEach(function(id){ el[id] = document.getElementById(id); });

  var ctx = el.canvas.getContext("2d");

  // ---------- helpers ----------
  function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

  function formatBytes(bytes){
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
    return (bytes/(1024*1024)).toFixed(2) + " MB";
  }

  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ el.toast.classList.remove("show"); }, 1800);
  }

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  // ---------- upload ----------
  el.dropzone.addEventListener("click", function(){ /* label already triggers input */ });
  el.fileInput.addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if (f) handleFile(f);
  });

  function handleFile(file){
    originalFile = file;
    var reader = new FileReader();
    reader.onload = function(ev){
      var image = new Image();
      image.onload = function(){
        img = image;
        naturalW = image.naturalWidth;
        naturalH = image.naturalHeight;

        el.canvas.width = naturalW;
        el.canvas.height = naturalH;
        ctx.clearRect(0,0,naturalW,naturalH);
        ctx.drawImage(image, 0, 0);

        sourceCanvas = document.createElement("canvas");
        sourceCanvas.width = naturalW;
        sourceCanvas.height = naturalH;
        sourceCanvas.getContext("2d").drawImage(image, 0, 0);

        el.stage.style.aspectRatio = naturalW + " / " + naturalH;

        el.origInfo.textContent = "Original: " + naturalW + "×" + naturalH + "px · " + formatBytes(file.size);

        verticalLines = [];
        horizontalLines = [];
        renderLines();

        el.uploadSection.classList.add("hidden");
        el.editorSection.classList.remove("hidden");
        el.resultsSection.classList.add("hidden");
        el.resultsGrid.innerHTML = "";
        el.cutbar.style.display = "flex";
        updateCutCount();
      };
      image.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  el.changeImage.addEventListener("click", function(){
    el.editorSection.classList.add("hidden");
    el.resultsSection.classList.add("hidden");
    el.cutbar.style.display = "none";
    el.uploadSection.classList.remove("hidden");
    el.fileInput.value = "";
  });

  // ---------- lines ----------
  function addLine(type){
    var arr = type === "v" ? verticalLines : horizontalLines;
    var bounds = [0, 100].concat(arr.map(function(l){ return l.pct; })).sort(function(a,b){ return a-b; });
    var bestGapStart = 0, bestGapSize = 0;
    for (var i = 0; i < bounds.length - 1; i++){
      var gap = bounds[i+1] - bounds[i];
      if (gap > bestGapSize){ bestGapSize = gap; bestGapStart = bounds[i]; }
    }
    var pct = bestGapStart + bestGapSize / 2;
    arr.push({ id: uid(), pct: pct });
    renderLines();
    updateCutCount();
  }

  el.addV.addEventListener("click", function(){ addLine("v"); });
  el.addH.addEventListener("click", function(){ addLine("h"); });
  el.clearLines.addEventListener("click", function(){
    verticalLines = [];
    horizontalLines = [];
    renderLines();
    updateCutCount();
  });

  function renderLines(){
    el.lines.innerHTML = "";
    verticalLines.forEach(function(l){ el.lines.appendChild(makeLineEl(l, "v")); });
    horizontalLines.forEach(function(l){ el.lines.appendChild(makeLineEl(l, "h")); });
  }

  function makeLineEl(line, type){
    var div = document.createElement("div");
    div.className = "cutline " + type;
    div.dataset.id = line.id;
    div.dataset.type = type;
    if (type === "v") div.style.left = line.pct + "%";
    else div.style.top = line.pct + "%";

    var bar = document.createElement("div");
    bar.className = "bar";
    div.appendChild(bar);

    var tick = document.createElement("div");
    tick.className = "tick";
    tick.textContent = tickLabel(line.pct, type);
    div.appendChild(tick);

    var del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "×";
    del.addEventListener("click", function(ev){
      ev.stopPropagation();
      removeLine(line.id, type);
    });
    div.appendChild(del);

    div.addEventListener("pointerdown", function(ev){
      ev.preventDefault();
      dragging = { id: line.id, type: type, el: div, tickEl: tick };
      div.setPointerCapture && div.setPointerCapture(ev.pointerId);
    });

    return div;
  }

  function tickLabel(pct, type){
    var px = Math.round(pct / 100 * (type === "v" ? naturalW : naturalH));
    return px + "px";
  }

  function removeLine(id, type){
    if (type === "v") verticalLines = verticalLines.filter(function(l){ return l.id !== id; });
    else horizontalLines = horizontalLines.filter(function(l){ return l.id !== id; });
    renderLines();
    updateCutCount();
  }

  window.addEventListener("pointermove", function(ev){
    if (!dragging) return;
    var rect = el.stage.getBoundingClientRect();
    var pct;
    if (dragging.type === "v") pct = (ev.clientX - rect.left) / rect.width * 100;
    else pct = (ev.clientY - rect.top) / rect.height * 100;
    pct = clamp(pct, 1, 99);

    var arr = dragging.type === "v" ? verticalLines : horizontalLines;
    var line = arr.find(function(l){ return l.id === dragging.id; });
    if (!line) return;
    line.pct = pct;

    if (dragging.type === "v") dragging.el.style.left = pct + "%";
    else dragging.el.style.top = pct + "%";
    dragging.tickEl.textContent = tickLabel(pct, dragging.type);
  });

  window.addEventListener("pointerup", function(){
    if (dragging){ dragging = null; updateCutCount(); }
  });

  // ---------- grid steppers ----------
  function stepperValue(elm){ return parseInt(elm.textContent, 10); }
  function setStepper(elm, v){ elm.textContent = clamp(v, 1, 8); }

  el.rowsMinus.addEventListener("click", function(){ setStepper(el.rowsVal, stepperValue(el.rowsVal) - 1); });
  el.rowsPlus.addEventListener("click", function(){ setStepper(el.rowsVal, stepperValue(el.rowsVal) + 1); });
  el.colsMinus.addEventListener("click", function(){ setStepper(el.colsVal, stepperValue(el.colsVal) - 1); });
  el.colsPlus.addEventListener("click", function(){ setStepper(el.colsVal, stepperValue(el.colsVal) + 1); });

  el.applyGrid.addEventListener("click", function(){
    var rows = stepperValue(el.rowsVal);
    var cols = stepperValue(el.colsVal);
    verticalLines = [];
    horizontalLines = [];
    for (var c = 1; c < cols; c++) verticalLines.push({ id: uid(), pct: c / cols * 100 });
    for (var r = 1; r < rows; r++) horizontalLines.push({ id: uid(), pct: r / rows * 100 });
    renderLines();
    updateCutCount();
  });

  function updateCutCount(){
    var n = (verticalLines.length + 1) * (horizontalLines.length + 1);
    el.cutCount.textContent = n;
  }

  // ---------- cut ----------
  el.cutBtn.addEventListener("click", function(){
    if (!sourceCanvas) return;
    pieces.forEach(function(p){ URL.revokeObjectURL(p.url); });
    pieces = [];

    var vB = uniqSorted([0,100].concat(verticalLines.map(function(l){ return l.pct; })))
      .map(function(pct){ return Math.round(pct/100*naturalW); });
    var hB = uniqSorted([0,100].concat(horizontalLines.map(function(l){ return l.pct; })))
      .map(function(pct){ return Math.round(pct/100*naturalH); });

    var jobs = [];
    for (var r = 0; r < hB.length - 1; r++){
      for (var c = 0; c < vB.length - 1; c++){
        var x1 = vB[c], x2 = vB[c+1], y1 = hB[r], y2 = hB[r+1];
        var w = x2 - x1, h = y2 - y1;
        if (w <= 0 || h <= 0) continue;
        jobs.push({ x1:x1, y1:y1, w:w, h:h, row:r, col:c });
      }
    }

    var promises = jobs.map(function(job){
      var pc = document.createElement("canvas");
      pc.width = job.w; pc.height = job.h;
      pc.getContext("2d").drawImage(sourceCanvas, job.x1, job.y1, job.w, job.h, 0, 0, job.w, job.h);
      return new Promise(function(resolve){
        pc.toBlob(function(blob){
          resolve({ blob: blob, url: URL.createObjectURL(blob), w: job.w, h: job.h, row: job.row, col: job.col });
        }, "image/png");
      });
    });

    Promise.all(promises).then(function(results){
      pieces = results;
      renderResults();
      showToast("Cut into " + pieces.length + " pieces");
    });
  });

  function uniqSorted(arr){
    var sorted = arr.slice().sort(function(a,b){ return a-b; });
    var out = [];
    sorted.forEach(function(v){
      if (out.length === 0 || Math.abs(v - out[out.length-1]) > 0.05) out.push(v);
    });
    return out;
  }

  // ---------- results ----------
  function pieceFilename(p, ext){
    return "cut-table-v2-r" + (p.row+1) + "-c" + (p.col+1) + "." + ext;
  }

  function renderResults(){
    el.resultsGrid.innerHTML = "";
    el.resultsCount.textContent = pieces.length + (pieces.length === 1 ? " piece" : " pieces");
    pieces.forEach(function(p){
      var card = document.createElement("div");
      card.className = "piece";

      var img = document.createElement("img");
      img.className = "thumb";
      img.src = p.url;
      card.appendChild(img);

      var meta = document.createElement("div");
      meta.className = "meta";

      var tag = document.createElement("div");
      tag.className = "tag";
      tag.innerHTML = "<b>R" + (p.row+1) + "C" + (p.col+1) + "</b> · " + p.w + "×" + p.h + "px<br>" + formatBytes(p.blob.size);
      meta.appendChild(tag);

      var dl = document.createElement("button");
      dl.className = "dl";
      dl.type = "button";
      dl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M12 15l-4-4M12 15l4-4"/><path d="M4 19h16"/></svg>';
      dl.addEventListener("click", function(){ downloadBlob(p.blob, pieceFilename(p, "png")); });
      meta.appendChild(dl);

      card.appendChild(meta);
      el.resultsGrid.appendChild(card);
    });
    el.resultsSection.classList.remove("hidden");
  }

  function downloadBlob(blob, filename){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }

  el.downloadAll.addEventListener("click", function(){
    if (!pieces.length) return;
    if (typeof JSZip === "undefined"){
      showToast("Couldn't load zip library — check your connection");
      return;
    }
    showToast("Zipping " + pieces.length + " pieces…");
    var zip = new JSZip();
    pieces.forEach(function(p){
      zip.file(pieceFilename(p, "png"), p.blob);
    });
    zip.generateAsync({ type: "blob" }).then(function(zipBlob){
      downloadBlob(zipBlob, "cut-table-v2-pieces.zip");
      showToast("Downloaded " + pieces.length + " pieces");
    });
  });

})();
</script>
</body>
</html>
