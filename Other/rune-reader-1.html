<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ᚠ Rune Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #131319;
    --bg-deep: #0d0d11;
    --panel: #1c1d24;
    --stone-a: #24252d;
    --stone-b: #1a1b21;
    --ink: #ece5d4;
    --muted: #92929c;
    --line: #34343d;
    --accent: #b6502e;
    --accent-soft: rgba(182,80,46,0.18);
    --gold: #cba05e;
    --radius: 14px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(ellipse at 50% -10%, #1e1f27 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--ink);
    font-family: 'Spectral', Georgia, serif;
    min-height:100vh;
    overscroll-behavior: none;
  }

  .app{
    max-width: 460px;
    margin: 0 auto;
    padding: 18px 18px 40px;
    min-height:100vh;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding-bottom: 16px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .brand-wrap{ display:flex; align-items:center; gap:8px; min-width:0; }
  .brand-glyph{
    font-size: 22px;
    color: var(--gold);
    line-height:1;
    flex-shrink:0;
  }
  .brand{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size: clamp(15px, 4.4vw, 19px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .lang-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius: 999px;
    overflow:hidden;
    flex-shrink:0;
  }
  .lang-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    background: transparent;
    color: var(--muted);
    border:none;
    padding: 7px 10px;
    cursor:pointer;
  }
  .lang-btn.active{
    background: var(--accent-soft);
    color: var(--gold);
  }
  .lang-btn:not(.active):hover{ color: var(--ink); }

  /* ---------- Main copy ---------- */
  .instruction{
    text-align:center;
    color: var(--muted);
    font-size: 14px;
    font-style: italic;
    margin: 0 0 18px;
  }

  /* ---------- Stone canvas ---------- */
  .stone-wrap{
    position:relative;
    width: min(84vw, 320px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-radius: var(--radius);
    background:
      linear-gradient(155deg, var(--stone-a), var(--stone-b) 60%);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.55),
      inset 0 -1px 0 rgba(255,255,255,0.03),
      0 10px 30px rgba(0,0,0,0.35);
    border: 1px solid #2c2d35;
    overflow:hidden;
    touch-action: none;
  }
  .stone-wrap::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .stone-wrap.casting::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(100deg, transparent 30%, rgba(203,160,94,0.35) 50%, transparent 70%);
    animation: sweep 0.7s ease-out;
    pointer-events:none;
  }
  @keyframes sweep{
    from{ transform: translateX(-120%); opacity:0; }
    30%{ opacity:1; }
    to{ transform: translateX(120%); opacity:0; }
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
  }

  .controls{
    display:flex;
    justify-content:center;
    gap:12px;
    margin: 18px 0 6px;
  }
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 11px 22px;
    border-radius: 999px;
    cursor:pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .btn:active{ transform: scale(0.96); }
  .btn-ghost:hover{ border-color: #47484f; }
  .btn-accent{
    background: linear-gradient(160deg, #c05a34, #9a3f24);
    border-color: transparent;
    color: #f3e6d8;
    box-shadow: 0 6px 18px rgba(154,63,36,0.35);
  }
  .btn-accent:hover{ filter: brightness(1.06); }

  /* ---------- Empty state ---------- */
  .empty-note{
    text-align:center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 22px;
    font-style: italic;
  }

  /* ---------- Result ---------- */
  .result{
    margin-top: 22px;
    padding: 22px 20px 24px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--line);
    text-align:center;
    animation: rise 0.45s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .result-glyph{
    font-size: 64px;
    line-height:1;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(203,160,94,0.45), 0 0 2px rgba(203,160,94,0.6);
    animation: ember 1.1s ease-out;
  }
  @keyframes ember{
    0%{ text-shadow: 0 0 0px rgba(203,160,94,0); opacity:0.2; }
    40%{ text-shadow: 0 0 26px rgba(203,160,94,0.7); opacity:1; }
    100%{ text-shadow: 0 0 18px rgba(203,160,94,0.45); }
  }
  .result-name{
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing: 0.12em;
    font-size: 19px;
    margin-top: 10px;
  }
  .result-sound{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.06em;
  }
  .result-meaning-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 18px;
  }
  .result-meaning{
    font-size: 15.5px;
    line-height: 1.55;
    color: var(--ink);
    margin: 8px 0 0;
  }
  .confidence-note{
    margin: 14px 0 0;
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    .result-glyph, .result, .stone-wrap.casting::after{ animation: none; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="brand-wrap">
      <span class="brand-glyph" aria-hidden="true">ᛟ</span>
      <h1 class="brand" data-i18n="title">Rune Reader</h1>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button class="lang-btn active" data-lang-btn="en">ENGLISH</button>
      <button class="lang-btn" data-lang-btn="et">EESTI</button>
    </div>
  </div>

  <p class="instruction" data-i18n="instruction">Draw a single rune, then scan.</p>

  <div class="stone-wrap" id="stoneWrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <button class="btn btn-ghost" id="clearBtn" data-i18n="clear">Clear</button>
    <button class="btn btn-accent" id="scanBtn" data-i18n="scan">Scan</button>
  </div>

  <p class="empty-note" id="emptyNote" data-i18n="emptyNote">Your rune will appear here after scanning.</p>

  <section class="result" id="result" hidden>
    <div class="result-glyph" id="resultGlyph">ᚠ</div>
    <div class="result-name" id="resultName">FEHU</div>
    <div class="result-sound" id="resultSound"><span data-i18n="soundLabel">Sound</span>: F</div>
    <div class="result-meaning-label" data-i18n="meaningLabel">Meaning</div>
    <p class="result-meaning" id="resultMeaning"></p>
    <p class="confidence-note" id="confidenceNote"></p>
  </section>

</div>

<script>
(function(){

  /* ================= i18n ================= */
  const translations = {
    en: {
      title: "Rune Reader",
      instruction: "Draw a single rune, then scan.",
      clear: "Clear",
      scan: "Scan",
      emptyNote: "Your rune will appear here after scanning.",
      meaningLabel: "Meaning",
      soundLabel: "Sound",
      needStroke: "Draw a rune on the stone before scanning.",
      confHigh: "The carving is clear.",
      confMed: "A fair match — the lines are close.",
      confLow: "The mark is faint — closest match shown."
    },
    et: {
      title: "Ruunide Lugeja",
      instruction: "Joonista üks ruun ja seejärel skanni.",
      clear: "Tühjenda",
      scan: "Skanni",
      emptyNote: "Sinu ruun ilmub siia pärast skannimist.",
      meaningLabel: "Tähendus",
      soundLabel: "Häälik",
      needStroke: "Joonista enne skannimist kivile ruun.",
      confHigh: "Kiri on selge.",
      confMed: "Üsna hea vaste — jooned on lähedased.",
      confLow: "Märk on hägune — näidatakse lähimat vastet."
    }
  };

  let lang = "en";

  /* ================= Rune data ================= */
  // Coordinates on a 0-100 grid; each rune's strokes are concatenated
  // into one path (approximate — this is a gestural match, not OCR).
  // Each rune's `raw` is now an array of STROKES (a stroke = array of [x,y]
  // pairs). Keeping strokes separate — instead of one flattened path — is
  // what lets the recognizer compare shapes stroke-by-stroke instead of
  // treating the gap between strokes as a drawn line.
  const RUNES = [
    { id:"fehu", glyph:"ᚠ", name:"FEHU", sound:"F",
      en:"Wealth — cattle, earned abundance, and prosperity gained through effort.",
      et:"Rikkus — kariloomad, vaevaga teenitud jõukus ja küllus.",
      raw:[ [[30,0],[30,100]], [[30,20],[80,0]], [[30,50],[80,30]] ] },
    { id:"uruz", glyph:"ᚢ", name:"URUZ", sound:"U",
      en:"The wild ox — raw strength, vitality, and untamed will.",
      et:"Metsveis — toores jõud, elujõud ja taltsutamatu tahe.",
      raw:[ [[25,0],[25,100]], [[25,0],[75,45]], [[75,45],[75,100]] ] },
    { id:"thurisaz", glyph:"ᚦ", name:"THURISAZ", sound:"TH",
      en:"The thorn — a force of conflict, defense, and disruptive power.",
      et:"Oga — konflikti, kaitse ja häiriva jõu sümbol.",
      raw:[ [[30,0],[30,100]], [[30,35],[65,50],[30,65]] ] },
    { id:"ansuz", glyph:"ᚨ", name:"ANSUZ", sound:"A",
      en:"The god's voice — inspiration, communication, and wisdom from the divine.",
      et:"Jumala hääl — inspiratsioon, suhtlus ja jumalik tarkus.",
      raw:[ [[30,0],[30,100]], [[30,10],[75,25]], [[30,30],[75,45]] ] },
    { id:"raidho", glyph:"ᚱ", name:"RAIDHO", sound:"R",
      en:"The journey — travel, rhythm, and the right order of things.",
      et:"Teekond — reisimine, rütm ja asjade õige kulg.",
      raw:[ [[30,0],[30,100]], [[30,0],[65,15],[30,35]], [[30,35],[70,100]] ] },
    { id:"kaunan", glyph:"ᚲ", name:"KAUNAN", sound:"K",
      en:"The torch — illumination, knowledge, and creative fire.",
      et:"Tõrvik — valgustus, teadmine ja loov tuli.",
      raw:[ [[70,0],[30,50],[70,100]] ] },
    { id:"gebo", glyph:"ᚷ", name:"GEBO", sound:"G",
      en:"The gift — exchange, partnership, and balance between giving and receiving.",
      et:"Kink — vahetus, partnerlus ja tasakaal andmise ja saamise vahel.",
      raw:[ [[25,0],[75,100]], [[75,0],[25,100]] ] },
    { id:"wunjo", glyph:"ᚹ", name:"WUNJO", sound:"W",
      en:"Joy — harmony, fellowship, and contentment earned.",
      et:"Rõõm — harmoonia, ühtekuuluvus ja teenitud rahulolu.",
      raw:[ [[30,10],[30,100]], [[30,10],[70,25],[30,40]] ] },
    { id:"hagalaz", glyph:"ᚺ", name:"HAGALAZ", sound:"H",
      en:"Hail — sudden disruption that clears the way for change.",
      et:"Rahe — äkiline häire, mis avab tee muutusele.",
      raw:[ [[25,0],[25,100]], [[75,0],[75,100]], [[25,45],[75,55]] ] },
    { id:"naudiz", glyph:"ᚾ", name:"NAUDIZ", sound:"N",
      en:"Need — constraint and hardship that teaches resilience.",
      et:"Vajadus — kitsikus ja raskus, mis õpetab vastupidavust.",
      raw:[ [[50,0],[50,100]], [[25,30],[75,70]] ] },
    { id:"isaz", glyph:"ᛁ", name:"ISAZ", sound:"I",
      en:"Ice — stillness, patience, and the pause before movement.",
      et:"Jää — paigalseis, kannatlikkus ja paus enne liikumist.",
      raw:[ [[50,0],[50,100]] ] },
    { id:"jera", glyph:"ᛃ", name:"JERA", sound:"J",
      en:"Harvest — the fruit of patient cycles and natural timing.",
      et:"Lõikus — kannatliku ringluse ja õige aja vili.",
      raw:[ [[20,10],[50,50],[20,90]], [[80,10],[50,50],[80,90]] ] },
    { id:"eihwaz", glyph:"ᛇ", name:"EIHWAZ", sound:"EI",
      en:"The yew tree — endurance, steadfastness, and quiet transformation.",
      et:"Jugapuu — vastupidavus, kindlameelsus ja vaikne muutumine.",
      raw:[ [[50,0],[50,100]], [[50,25],[75,10]] ] },
    { id:"perthro", glyph:"ᛈ", name:"PERTHRO", sound:"P",
      en:"Mystery — fate, chance, and the hidden workings of destiny.",
      et:"Saladus — saatus, juhus ja peidetud saatuse käik.",
      raw:[ [[30,0],[30,100]], [[30,50],[70,50],[70,90],[30,90]] ] },
    { id:"algiz", glyph:"ᛉ", name:"ALGIZ", sound:"Z",
      en:"Protection — the elk's guard and a connection to higher powers.",
      et:"Kaitse — põdra valvsus ja side kõrgemate jõududega.",
      raw:[ [[50,40],[50,100]], [[50,40],[25,0]], [[50,40],[75,0]] ] },
    { id:"sowilo", glyph:"ᛊ", name:"SOWILO", sound:"S",
      en:"The sun — success, vital energy, and guiding light.",
      et:"Päike — edu, elujõud ja teejuhtiv valgus.",
      raw:[ [[20,0],[60,40],[30,60],[70,100]] ] },
    { id:"tiwaz", glyph:"ᛏ", name:"TIWAZ", sound:"T",
      en:"Justice — sacrifice, honor, and the warrior's sense of duty.",
      et:"Õiglus — ohver, au ja sõdalase kohusetunne.",
      raw:[ [[50,20],[50,100]], [[50,20],[25,50]], [[50,20],[75,50]] ] },
    { id:"berkanan", glyph:"ᛒ", name:"BERKANAN", sound:"B",
      en:"The birch — growth, renewal, and nurturing new beginnings.",
      et:"Kask — kasv, uuenemine ja uute alguste hoidmine.",
      raw:[ [[30,0],[30,100]], [[30,0],[60,20],[30,40]], [[30,40],[65,65],[30,90]] ] },
    { id:"ehwaz", glyph:"ᛖ", name:"EHWAZ", sound:"E",
      en:"The horse — trust, partnership, and steady progress together.",
      et:"Hobune — usaldus, partnerlus ja ühine edasiliikumine.",
      raw:[ [[25,100],[25,0],[50,50],[75,0],[75,100]] ] },
    { id:"mannaz", glyph:"ᛗ", name:"MANNAZ", sound:"M",
      en:"Humankind — the self, community, and shared humanity.",
      et:"Inimkond — mina, kogukond ja jagatud inimlikkus.",
      raw:[ [[25,0],[25,100]], [[75,0],[75,100]], [[25,0],[75,100]], [[75,0],[25,100]] ] },
    { id:"laguz", glyph:"ᛚ", name:"LAGUZ", sound:"L",
      en:"Water — intuition, flow, and the undercurrents of feeling.",
      et:"Vesi — intuitsioon, vool ja tunnete varjatud hoovused.",
      raw:[ [[30,0],[30,70],[70,100]] ] },
    { id:"ingwaz", glyph:"ᛜ", name:"INGWAZ", sound:"NG",
      en:"Fertility — potential held quietly until it is ready to emerge.",
      et:"Viljakus — potentsiaal, mis ootab vaikselt oma aega.",
      raw:[ [[50,0],[80,50],[50,100],[20,50],[50,0]] ] },
    { id:"dagaz", glyph:"ᛞ", name:"DAGAZ", sound:"D",
      en:"The day — breakthrough, awakening, and clarity after darkness.",
      et:"Päev — läbimurre, ärkamine ja selgus pärast pimedust.",
      raw:[ [[0,35],[100,65]], [[0,65],[100,35]] ] },
    { id:"othala", glyph:"ᛟ", name:"OTHALA", sound:"O",
      en:"Heritage — ancestral home, inherited legacy, and belonging.",
      et:"Pärand — esivanemate kodu, päritud pärand ja kuulumine.",
      raw:[ [[50,0],[80,30],[50,60],[20,30],[50,0]], [[30,60],[20,100]], [[70,60],[80,100]] ] }
  ];

  /* ================= $P Point-Cloud Recognizer =================
     Multi-stroke gestures are compared as an unordered "cloud" of
     points rather than one connected path. This is the key fix over
     a naive single-path approach: strokes are resampled *individually*
     (proportional to their own length) so the gap between lifting the
     pen after one stroke and starting the next is never treated as a
     drawn line. Matching is also insensitive to which stroke the
     person drew first or which direction they drew it. */
  const NUM_POINTS = 32;
  const SIZE = 250;

  function deg2rad(d){ return d * Math.PI / 180; }
  function distance(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function pathLength(pts){
    let d = 0;
    for(let i=1;i<pts.length;i++) d += distance(pts[i-1], pts[i]);
    return d;
  }

  // Resample a single stroke to exactly n points.
  function resampleStroke(points, n){
    if(n <= 1) return [{ x:points[0].x, y:points[0].y }];
    const I = pathLength(points) / (n - 1) || 1;
    let D = 0;
    const pts = points.map(p=>({x:p.x,y:p.y}));
    const out = [pts[0]];
    for(let i=1;i<pts.length;i++){
      const d = distance(pts[i-1], pts[i]);
      if(D + d >= I){
        const t = d === 0 ? 0 : (I - D) / d;
        const q = { x: pts[i-1].x + t*(pts[i].x-pts[i-1].x),
                    y: pts[i-1].y + t*(pts[i].y-pts[i-1].y) };
        out.push(q);
        pts.splice(i, 0, q);
        D = 0;
      } else {
        D += d;
      }
    }
    while(out.length < n) out.push(pts[pts.length-1]);
    if(out.length > n) out.length = n;
    return out;
  }

  // Build a fixed-size point cloud from an array of strokes, giving each
  // stroke a share of the total points proportional to its own length.
  function buildCloud(strokes, n){
    const usable = strokes.filter(s => s.length >= 1);
    const lengths = usable.map(s => Math.max(pathLength(s), 0.0001));
    const total = lengths.reduce((a,b)=>a+b, 0) || 1;
    const allocs = lengths.map(l => Math.max(1, Math.round(n * l / total)));
    let diff = n - allocs.reduce((a,b)=>a+b, 0);
    let idx = allocs.indexOf(Math.max(...allocs));
    allocs[idx] = Math.max(1, allocs[idx] + diff);
    const cloud = [];
    usable.forEach((s, i) => { cloud.push(...resampleStroke(s, allocs[i])); });
    return cloud;
  }

  function centroid(pts){
    let x=0,y=0;
    for(const p of pts){ x+=p.x; y+=p.y; }
    return { x:x/pts.length, y:y/pts.length };
  }

  // Translate to origin and scale UNIFORMLY (preserving aspect ratio),
  // so a tall thin stroke never gets stretched into matching a wide one.
  function normalize(cloud, size){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const p of cloud){
      minX=Math.min(minX,p.x); minY=Math.min(minY,p.y);
      maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
    }
    const w = (maxX-minX) || 1, h = (maxY-minY) || 1;
    const scale = size / Math.max(w, h);
    const scaled = cloud.map(p => ({ x:(p.x-minX)*scale, y:(p.y-minY)*scale }));
    const c = centroid(scaled);
    return scaled.map(p => ({ x:p.x-c.x, y:p.y-c.y }));
  }

  function cloudDistance(pts1, pts2, n, start){
    const matched = new Array(n).fill(false);
    let sum = 0;
    let i = start;
    do {
      let index = -1, minDist = Infinity;
      for(let j=0;j<n;j++){
        if(!matched[j]){
          const d = distance(pts1[i], pts2[j]);
          if(d < minDist){ minDist = d; index = j; }
        }
      }
      matched[index] = true;
      const weight = 1 - (((i - start + n) % n) / n);
      sum += weight * minDist;
      i = (i + 1) % n;
    } while(i !== start);
    return sum;
  }

  function greedyCloudMatch(pts1, pts2, n){
    const step = Math.max(1, Math.floor(Math.pow(n, 0.5)));
    let min = Infinity;
    for(let i=0;i<n;i+=step){
      const d1 = cloudDistance(pts1, pts2, n, i);
      const d2 = cloudDistance(pts2, pts1, n, i);
      min = Math.min(min, d1, d2);
    }
    return min;
  }

  function preprocess(strokes){
    return normalize(buildCloud(strokes, NUM_POINTS), SIZE);
  }

  // Precompute templates once.
  RUNES.forEach(r => {
    const strokesAsPoints = r.raw.map(stroke => stroke.map(([x,y]) => ({x,y})));
    r.cloud = preprocess(strokesAsPoints);
  });

  function classify(strokes){
    const candidate = preprocess(strokes);
    let best = null, bestDist = Infinity;
    for(const r of RUNES){
      const d = greedyCloudMatch(candidate, r.cloud, NUM_POINTS);
      if(d < bestDist){ bestDist = d; best = r; }
    }
    const score = Math.max(0, 1 - bestDist / (0.6 * SIZE));
    return { match: best, score };
  }

  /* ================= Drawing ================= */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stoneWrap = document.getElementById('stoneWrap');
  let strokes = [];      // array of stroke arrays of {x,y}
  let currentStroke = null;
  let hasInk = false;

  function sizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function redraw(){
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for(const stroke of strokes) drawStroke(stroke);
  }

  function drawStroke(stroke){
    if(stroke.length < 2) return;
    // soft dark groove shadow
    ctx.beginPath();
    ctx.moveTo(stroke[0].x, stroke[0].y);
    for(let i=1;i<stroke.length;i++) ctx.lineTo(stroke[i].x, stroke[i].y);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 7;
    ctx.stroke();
    // ember highlight
    ctx.beginPath();
    ctx.moveTo(stroke[0].x, stroke[0].y);
    for(let i=1;i<stroke.length;i++) ctx.lineTo(stroke[i].x, stroke[i].y);
    ctx.strokeStyle = '#d8b571';
    ctx.lineWidth = 3.4;
    ctx.shadowColor = 'rgba(203,160,94,0.55)';
    ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function getPos(evt){
    const rect = canvas.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    currentStroke = [getPos(e)];
    strokes.push(currentStroke);
    hasInk = true;
    hideResultIfWanted(false);
  });
  canvas.addEventListener('pointermove', (e)=>{
    if(!currentStroke) return;
    e.preventDefault();
    currentStroke.push(getPos(e));
    redraw();
  });
  function endStroke(e){
    if(!currentStroke) return;
    currentStroke = null;
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave', endStroke);

  window.addEventListener('resize', ()=>{
    strokes = [];
    currentStroke = null;
    hasInk = false;
    sizeCanvas();
  });

  /* ================= UI wiring ================= */
  const clearBtn = document.getElementById('clearBtn');
  const scanBtn = document.getElementById('scanBtn');
  const emptyNote = document.getElementById('emptyNote');
  const result = document.getElementById('result');
  const resultGlyph = document.getElementById('resultGlyph');
  const resultName = document.getElementById('resultName');
  const resultSound = document.getElementById('resultSound');
  const resultMeaning = document.getElementById('resultMeaning');
  const confidenceNote = document.getElementById('confidenceNote');

  let lastResult = null; // {rune, score}

  function hideResultIfWanted(showEmpty){
    result.hidden = true;
    emptyNote.hidden = !showEmpty;
  }

  clearBtn.addEventListener('click', ()=>{
    strokes = [];
    currentStroke = null;
    hasInk = false;
    lastResult = null;
    redraw();
    result.hidden = true;
    emptyNote.hidden = false;
    emptyNote.textContent = translations[lang].emptyNote;
  });

  scanBtn.addEventListener('click', ()=>{
    const validStrokes = strokes.filter(s => s.length >= 1);
    if(!hasInk || validStrokes.length === 0){
      emptyNote.hidden = false;
      emptyNote.textContent = translations[lang].needStroke;
      result.hidden = true;
      return;
    }
    const { match, score } = classify(validStrokes);
    lastResult = { rune: match, score };
    renderResult();

    stoneWrap.classList.remove('casting');
    void stoneWrap.offsetWidth; // restart animation
    stoneWrap.classList.add('casting');
  });

  function renderResult(){
    if(!lastResult) return;
    const { rune, score } = lastResult;
    const t = translations[lang];

    emptyNote.hidden = true;
    result.hidden = false;
    result.style.animation = 'none';
    void result.offsetWidth;
    result.style.animation = '';

    resultGlyph.textContent = rune.glyph;
    resultName.textContent = rune.name;
    resultSound.innerHTML = '<span>' + t.soundLabel + '</span>: ' + rune.sound;
    resultMeaning.textContent = lang === 'en' ? rune.en : rune.et;

    let note;
    if(score >= 0.75) note = t.confHigh;
    else if(score >= 0.55) note = t.confMed;
    else note = t.confLow;
    confidenceNote.textContent = note;
  }

  /* ================= Language switching ================= */
  document.querySelectorAll('[data-lang-btn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      lang = btn.getAttribute('data-lang-btn');
      document.querySelectorAll('[data-lang-btn]').forEach(b=>{
        b.classList.toggle('active', b === btn);
      });
      applyTranslations();
      if(lastResult) renderResult();
      else if(!emptyNote.hidden) emptyNote.textContent = translations[lang].emptyNote;
    });
  });

  function applyTranslations(){
    const t = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      if(t[key] !== undefined) el.textContent = t[key];
    });
    document.documentElement.lang = lang;
  }

  /* ================= Init ================= */
  applyTranslations();
  sizeCanvas();

})();
</script>
</body>
</html>
