<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=980">
<meta name="HandheldFriendly" content="false">
<title>Materia Medica — Field Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12140f;
    --surface:#1b1f16;
    --surface-2:#20241a;
    --border:#333a28;
    --border-soft:#262b1e;
    --ink:#e9e6db;
    --ink-muted:#9aa08c;
    --ink-faint:#6b715f;
    --moss:#8aa06b;
    --amber:#c98a4b;
    --amber-dim:#7a5330;
    --rust:#b06246;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(138,160,107,0.07), transparent 45%),
      radial-gradient(ellipse at 90% 0%, rgba(201,138,75,0.05), transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:56px;
  }
  ::selection{ background:var(--amber-dim); color:var(--ink); }

  /* ---------- header ---------- */
  header{
    padding:34px 20px 22px;
    border-bottom:1px solid var(--border-soft);
    position:relative;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--moss);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,7vw,38px);
    margin:0 0 6px;
    letter-spacing:-0.01em;
    line-height:1.05;
  }
  header p.sub{
    margin:0;
    color:var(--ink-muted);
    font-size:13.5px;
    max-width:52ch;
  }
  header .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    margin-top:14px;
  }

  /* ---------- card grid ---------- */
  main{
    padding:18px 16px 10px;
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    max-width:920px;
    margin:0 auto;
  }
  @media(min-width:680px){
    main{ grid-template-columns:1fr 1fr; padding:22px 24px; gap:16px; }
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:18px 18px 16px;
    position:relative;
    overflow:hidden;
    transition:border-color .2s ease;
  }
  .card:before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(138,160,107,.35), transparent);
  }
  .card:hover{ border-color:var(--border); }

  /* ---------- card top: meta column + square image ---------- */
  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }
  .card-meta{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding-top:2px;
  }
  .stock-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:4px 8px;
    border-radius:20px;
    border:1px solid;
    white-space:nowrap;
    width:fit-content;
  }
  .stock-badge:before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background:currentColor;
    flex:0 0 auto;
  }
  .stock-badge.in{ color:var(--moss); border-color:#3c4a30; background:rgba(138,160,107,.08); }
  .stock-badge.out{ color:var(--rust); border-color:#5a3a2e; background:rgba(176,98,70,.08); }
  .price{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:.01em;
  }
  .card-image{
    flex:0 0 auto;
    width:78px;
    aspect-ratio:1/1;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--border-soft);
    background:var(--surface-2);
  }
  .card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* ---------- buy / view-product button ---------- */
  .buy-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--bg);
    background:var(--amber);
    padding:10px;
    border-radius:9px;
    margin:2px 0 16px;
    transition:background .15s ease;
  }
  .buy-btn:hover{ background:#d89a5c; }
  .buy-btn:active{ background:#b97a3e; }

  .names h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    margin:0;
    line-height:1.2;
  }
  .names .latin{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:13.5px;
    color:var(--moss);
    margin:2px 0 0;
  }

  /* ---------- hashtag tags (replaces psychoactive pill) ---------- */
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    margin:8px 0 0;
  }
  .hashtag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.02em;
    color:var(--amber);
  }

  /* potency vial gauge */
  .potency{ margin:14px 0 15px; }
  .potency-label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  .potency-label .val{ color:var(--ink-muted); font-size:11px; letter-spacing:0; }
  .gauge{
    position:relative;
    height:16px;
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:3px;
    overflow:hidden;
  }
  .gauge-fill{
    position:absolute; top:0; left:0; bottom:0;
    background:linear-gradient(90deg, #6d4726, var(--amber));
    border-radius:2px 0 0 2px;
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }
  .gauge-ticks{
    position:absolute; inset:0;
    display:flex;
  }
  .gauge-ticks i{
    flex:1;
    border-right:1px solid rgba(0,0,0,.35);
  }
  .gauge-ticks i:last-child{ border-right:none; }

  .effects{
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink);
    margin:0 0 6px;
  }
  .compounds{
    font-size:12px;
    line-height:1.5;
    color:var(--ink-faint);
    margin:0 0 14px;
  }
  .compounds b{ color:var(--ink-muted); font-weight:500; }

  /* receptor table, grouped by substance */
  .receptors-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 8px;
  }
  .rtable{
    width:100%;
    border-collapse:collapse;
    border:1px solid var(--border-soft);
    border-radius:8px;
    overflow:hidden;
    font-size:12px;
  }
  .rtable thead th{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    text-align:left;
    background:var(--surface-2);
    padding:7px 9px;
    font-weight:500;
    border-bottom:1px solid var(--border-soft);
  }
  .rtable tbody tr.rrow{
    cursor:pointer;
    transition:background .15s ease;
    border-bottom:1px solid var(--border-soft);
  }
  .rtable tbody tr.rrow:last-child{ border-bottom:none; }
  .rtable tbody tr.rrow:hover{ background:#28311f; }
  .rtable tbody tr.rrow:active{ background:#2c3722; }
  .rtable tbody tr.rrow.inert{ cursor:default; }
  .rtable tbody tr.rrow.inert:hover{ background:none; }
  .rtable td{
    padding:8px 9px 8px 16px;
    color:var(--ink);
    vertical-align:top;
  }
  .rtable td.rname{
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink);
    font-size:11.5px;
  }
  .rtable td.ractivity{
    color:var(--moss);
  }
  .rtable td.raffinity{
    color:var(--ink-faint);
    font-size:11px;
  }
  /* substance divider row */
  .rtable tr.substance-row td{
    padding:8px 9px;
    background:var(--surface-2);
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:12.5px;
    color:var(--amber);
    border-bottom:1px solid var(--border-soft);
    border-top:1px solid var(--border-soft);
  }
  .rtable tr.substance-row:first-child td{ border-top:none; }
  .rtable.empty-table td{
    color:var(--ink-faint);
    font-style:italic;
    cursor:default;
    padding:10px 9px;
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(8,9,6,.72);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:50;
    padding:0;
  }
  @media(min-width:680px){
    .overlay{ align-items:center; padding:20px; }
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .modal{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-top:1px solid #3c4430;
    width:100%;
    max-width:480px;
    max-height:82vh;
    overflow-y:auto;
    border-radius:18px 18px 0 0;
    padding:22px 22px 28px;
    transform:translateY(16px);
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  @media(min-width:680px){
    .modal{ border-radius:16px; transform:translateY(8px) scale(.98); }
  }
  .overlay.open .modal{ transform:translateY(0) scale(1); }

  .modal-handle{
    width:36px; height:4px;
    background:var(--border);
    border-radius:4px;
    margin:0 auto 16px;
  }
  @media(min-width:680px){ .modal-handle{ display:none; } }

  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:4px;
  }
  .modal h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    margin:0;
    line-height:1.2;
  }
  .modal-activity{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--bg);
    background:var(--moss);
    padding:5px 9px;
    border-radius:20px;
    margin-top:3px;
  }
  .modal-source{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    color:var(--ink-faint);
    margin:6px 0 0;
  }
  .modal-subtitle{
    font-size:12.5px;
    color:var(--amber);
    margin:8px 0 16px;
    line-height:1.5;
    border-bottom:1px solid var(--border-soft);
    padding-bottom:14px;
  }
  .modal-body{
    font-size:14px;
    line-height:1.68;
    color:var(--ink);
    white-space:pre-line;
  }
  .modal-close{
    margin-top:22px;
    width:100%;
    background:transparent;
    border:1px solid var(--border);
    color:var(--ink-muted);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:11px;
    border-radius:9px;
    cursor:pointer;
  }
  .modal-close:hover{ border-color:var(--moss); color:var(--ink); }

  footer{
    text-align:center;
    color:var(--ink-faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    padding:26px 20px 10px;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Personal Field Index</p>
  <h1>Materia Medica</h1>
  <p class="sub">A working reference of botanicals/substances, their traditional effects, and the receptor systems thought to mediate them. Sorted most → least psychoactive.</p>
  <p class="count" id="herbCount"></p>
</header>

<main id="cardGrid"></main>

<footer>Compiled from field & literature notes · tap a receptor row to read more</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <span class="modal-activity" id="modalActivity"></span>
    </div>
    <p class="modal-subtitle" id="modalSubtitle"></p>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" id="modalClose">Close</button>
  </div>
</div>

<script>
/* ================================================================
   HOW TO EDIT THIS FILE (read this first — for humans and AI agents)
   ================================================================

   This page has TWO data blocks below: RECEPTORS and HERBS.
   Everything else (CSS, HTML skeleton, render/modal logic) is
   generic and should NOT need to change when you add entries.

   ----------------------------------------------------------------
   BLOCK 1 — RECEPTORS
   ----------------------------------------------------------------
   A dictionary of receptor/target "glossary entries". Each key is
   a short machine-friendly ID (referenced later from HERBS[].
   substances[].hits[].key). Each value is:

     {
       title:    "Human-readable receptor/target name",
       activity: "Short activity label shown as a pill in the modal
                  (e.g. 'Agonist', 'Antagonist', 'Inhibitor',
                  'Positive allosteric modulator', 'Modulator')",
       subtitle: "One line: <endogenous ligand(s)> — <receptor/
                  molecule class, e.g. 'Gq/11-coupled GPCR' or
                  'Ligand-gated ion channel'>",
       body:     "1-3 short paragraphs, separated by \\n\\n.
                  Paragraph 1: where the target is located/expressed
                  and what it normally does.
                  Paragraph 2: what happens functionally when this
                  specific activity (agonism/antagonism/inhibition/
                  etc.) occurs — effects and risks."
     }

   Add one new RECEPTORS entry PER UNIQUE (target + activity)
   combination you reference. Reuse an existing key if an item
   hits the exact same target with the exact same activity type.

   ----------------------------------------------------------------
   BLOCK 2 — HERBS
   ----------------------------------------------------------------
   An array of item entries (herb / substance / product cards).
   Each entry is:

     {
       name:         "Common name",
       latin:        "Latin/scientific name (or other subtitle ID)",
       image:        "URL of a 1:1 (square) product/reference image",
       inStock:      true | false,   // drives the stock badge
       price:        "Display string, e.g. '$24.00'",
       tags:         ["Tag1","Tag2"],// shown as #Tag1 #Tag2 under the name
       link:         "URL the 'View Product →' button opens
                      (in a new tab)",
       potency:      0.0–10.0,       // drives the gauge bar fill;
                                      // list auto-sorts high→low
       effects:      "One sentence, comma-separated list of
                      effects/traditional uses.",
       compounds:    "Comma-separated list of key active compounds.",
       substances: [
         {
           name: "Compound name (groups related receptor hits
                  under one sub-heading in the table)",
           hits: [
             {
               key:      "RECEPTORS_key_or_null",
               // null = mechanism unknown/unconfirmed (renders as
               // a non-clickable row); otherwise must exactly match
               // a key in RECEPTORS above so the row is clickable
               // and opens the matching modal.
               receptor: "Receptor/target name AS SHOWN IN THE TABLE
                          ROW (can differ slightly in wording from
                          RECEPTORS[key].title, e.g. to add a
                          parenthetical)",
               activity: "Short activity phrase shown in the table
                          row (can be more specific/hedged than the
                          RECEPTORS activity pill, e.g. 'Proposed
                          inhibitor')",
               affinity: "Binding/potency data if known (Ki, IC50,
                          etc.), or a hedge string like
                          'Not quantified', 'No data located',
                          'Speculative', or '—' if nothing applies."
             }
             // ...one object per receptor/target this compound hits
           ]
         }
         // ...one object per named active compound in this item.
         // If NO receptor data exists at all for the item, use:
         // substances: [] — the renderer shows an "unconfirmed
         // mechanism" placeholder row.
       ]
     }

   CHECKLIST FOR ADDING A NEW ITEM:
   1. Pick/confirm a `potency` 0–10 (10 = most psychoactive/potent).
   2. Provide a square (1:1) `image` URL, `inStock` boolean, and
      `price` display string.
   3. Add 1-4 short `tags` (no leading "#" needed — it's added by
      the renderer). These replace the old psychoactive/calm pill.
   4. Provide a `link` URL — this powers the "View Product →"
      button, which opens in a new tab.
   5. Write `effects` and `compounds` as short plain sentences.
   6. For each active compound, list every receptor/target hit.
   7. For each hit, either point `key` at an EXISTING RECEPTORS
      entry, or add a NEW RECEPTORS entry first, then reference it.
   8. Do not edit gaugeTicks(), tagsHTML(), receptorTable(),
      cardHTML(), or the modal logic below — they are generic and
      read from the data.
   ================================================================ */


/* ============================================================
   DATA — receptor/activity descriptions (for popups)
   Add one entry per unique (target, activity) pair referenced
   by any hit.key in HERBS below.
   ============================================================ */
const RECEPTORS = {

  // EXAMPLE 1 — ionotropic receptor, antagonist
  "5HT3A_antagonist": {
    title: "5-HT3A Receptor",
    activity: "Antagonist",
    subtitle: "Serotonin — Ligand-gated cation channel (ionotropic receptor)",
    body: "Located on vagal afferents, brainstem nuclei, limbic regions, and terminals of several neurotransmitter systems, this receptor rapidly depolarizes neurons and regulates serotonin release, nausea, visceral signaling, and cortical–limbic activity.\n\nAntagonism reduces emetic and visceral sensory signaling and may produce anxiolytic, anti-nausea, and cognition-supporting effects by altering serotonin, dopamine, and acetylcholine release."
  },

  // EXAMPLE 2 — GPCR, agonist
  "5HT2A_agonist": {
    title: "5-HT2A Receptor",
    activity: "Agonist",
    subtitle: "Serotonin — Gq/11-coupled GPCR",
    body: "Located prominently in the cerebral cortex, especially on layer V pyramidal neurons, as well as in thalamic and vascular tissues, 5-HT2A receptors regulate glutamate release, cortical network activity, perception, and vascular tone.\n\nAgonism can produce altered perception, hallucination-like effects, cognitive and emotional changes, and behavioral activation; it may also increase cortical glutamatergic signaling and sympathetic or vascular responses."
  }

  // ADD MORE RECEPTORS ENTRIES HERE, comma-separated, same shape as above.

};

/* ============================================================
   DATA — items, each broken down by substance → receptor hits
   Add one object per item, same shape as the two examples below.
   ============================================================ */
const HERBS = [

  // EXAMPLE ITEM 1 — non-psychoactive, in stock, single compound/hit
  { name:"Siberian Motherwort", latin:"Leonurus sibiricus",
    image:"https://c8.alamy.com/comp/2AW6NMG/lamotrigine-molecule-it-is-used-in-the-treatment-of-epilepsy-and-bipolar-disorder-structural-chemical-formula-and-molecule-model-vector-illustrati-2AW6NMG.jpg",
    inStock:true, price:"$18.00",
    tags:["Calming","Cardiovascular"],
    link:"https://example.com/products/siberian-motherwort",
    potency:1.0,
    effects:"Calming, mild anxiolytic/sedative, anti-inflammatory, cardiovascular support (vasorelaxant).",
    compounds:"Leonurine, leosibirin-type diterpenes, flavonoids, phenolic acids",
    substances:[
      { name:"Leonurine", hits:[
        { key:"5HT3A_antagonist", receptor:"5-HT3A", activity:"High affinity (antagonist/modulator)", affinity:"Not quantified (Ki not documented)" }
      ]}
    ] },

  // EXAMPLE ITEM 2 — psychoactive, out of stock, multiple compounds/hits
  { name:"Jurema", latin:"Mimosa tenuiflora",
    image:"https://c8.alamy.com/comp/2AW6NMG/lamotrigine-molecule-it-is-used-in-the-treatment-of-epilepsy-and-bipolar-disorder-structural-chemical-formula-and-molecule-model-vector-illustrati-2AW6NMG.jpg",
    inStock:false, price:"$42.00",
    tags:["Psychedelic","Visionary","MAOI-dependent"],
    link:"https://example.com/products/jurema",
    potency:9.5,
    effects:"Psychedelic (visionary) when combined with a MAOI; orally inactive alone due to gut MAO breakdown.",
    compounds:"DMT (root bark ~1–1.7%), yuremamine, tannins",
    substances:[
      { name:"DMT", hits:[
        { key:"5HT2A_agonist", receptor:"5-HT2A", activity:"Agonist", affinity:"Primary target, not quantified" }
      ]}
    ] }

  // ADD MORE HERBS/ITEMS HERE, comma-separated, same shape as above.
  // Use `key: null` for any hit whose receptor/mechanism is unknown:
  //   { key:null, receptor:"Unknown / unconfirmed", activity:"—", affinity:"No data located" }

];

HERBS.sort((a,b)=> b.potency - a.potency);

/* ============================================================
   RENDER — generic, do not edit when adding data above
   ============================================================ */
const grid = document.getElementById('cardGrid');
document.getElementById('herbCount').textContent = HERBS.length + ' entries logged';

function gaugeTicks(){
  let s='';
  for(let i=0;i<10;i++) s += '<i></i>';
  return s;
}

function receptorTable(substances){
  if(!substances || !substances.length){
    return `<table class="rtable empty-table"><tbody>
      <tr><td>Mechanism unconfirmed — no characterized receptor targets</td></tr>
    </tbody></table>`;
  }
  const body = substances.map(sub=>{
    const subRow = `<tr class="substance-row"><td colspan="3">${sub.name}</td></tr>`;
    const rows = sub.hits.map(hit=>{
      const r = hit.key ? RECEPTORS[hit.key] : null;
      const clickable = !!r;
      return `<tr class="rrow${clickable ? '' : ' inert'}" ${clickable ? `data-key="${hit.key}" tabindex="0" role="button" aria-haspopup="dialog"` : ''}>
        <td class="rname">${hit.receptor}</td>
        <td class="ractivity">${hit.activity}</td>
        <td class="raffinity">${hit.affinity}</td>
      </tr>`;
    }).join('');
    return subRow + rows;
  }).join('');

  return `<table class="rtable">
    <thead><tr><th>Receptor</th><th>Activity</th><th>Affinity</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function tagsHTML(tags){
  if(!tags || !tags.length) return '';
  return `<div class="tags">${tags.map(t=>`<span class="hashtag">#${t}</span>`).join('')}</div>`;
}

function cardHTML(h){
  const pct = Math.min(100, (h.potency/10)*100);
  const tableHTML = receptorTable(h.substances);

  return `
  <article class="card">
    <div class="card-top">
      <div class="card-meta">
        <span class="stock-badge ${h.inStock ? 'in' : 'out'}">${h.inStock ? 'In Stock' : 'Out of Stock'}</span>
        <span class="price">${h.price}</span>
      </div>
      <div class="card-image">
        <img src="${h.image}" alt="${h.name}" loading="lazy">
      </div>
    </div>

    <div class="names">
      <h2>${h.name}</h2>
      <p class="latin">${h.latin}</p>
    </div>
    ${tagsHTML(h.tags)}

    <div class="potency">
      <div class="potency-label">
        <span>Potency</span>
        <span class="val">${h.potency.toFixed(1)} / 10</span>
      </div>
      <div class="gauge">
        <div class="gauge-fill" style="width:${pct}%"></div>
        <div class="gauge-ticks">${gaugeTicks()}</div>
      </div>
    </div>

    <p class="effects">${h.effects}</p>
    <p class="compounds"><b>Compounds:</b> ${h.compounds}</p>

    <a class="buy-btn" href="${h.link}" target="_blank" rel="noopener noreferrer">View Product →</a>

    <p class="receptors-label">Receptors</p>
    ${tableHTML}
  </article>`;
}

grid.innerHTML = HERBS.map(cardHTML).join('');

/* ---------- modal logic (generic, do not edit) ---------- */
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modalTitle');
const modalActivity = document.getElementById('modalActivity');
const modalSubtitle = document.getElementById('modalSubtitle');
const modalBody = document.getElementById('modalBody');

function openModal(key){
  const r = RECEPTORS[key];
  if(!r) return;
  modalTitle.textContent = r.title;
  modalActivity.textContent = r.activity;
  modalSubtitle.textContent = r.subtitle;
  modalBody.textContent = r.body;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

grid.addEventListener('click', (e)=>{
  const row = e.target.closest('tr[data-key]');
  if(row) openModal(row.dataset.key);
});
grid.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('tr[data-key]');
  if(row){ e.preventDefault(); openModal(row.dataset.key); }
});
document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
